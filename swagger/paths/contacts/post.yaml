#/swagger/paths/students/post.yaml

tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create a new contact with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'John Smith'
          phoneNumber:
            description: "Contact's phone number"
            type: number
            example: 38056745667
          email:
            description: "Contact's email"
            type: string
            example: friendemail@gmail.com
          isFavourite:
            description: "Whether this contact is favourite or not"
            type: boolean
            example: true
          contactType:
            description: 'Type/group of contact'
            type: string
            enum: ['work', 'personal', 'home']
          photo:
            description: "Link to contact's profile photo"
            type: string
            format: binary


responses:
  '201':
    description: Creates a new contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              type: object
              $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'

