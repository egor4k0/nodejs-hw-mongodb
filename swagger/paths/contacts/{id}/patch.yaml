tags:
  - Contacts
summary: Patch contact by id
operationId: patchContact
description: 'Patch contact with specified id'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'John Smith'
          phoneNumber:
            description: "Contact's phone number"
            type: number
            example: 38056745667
          email:
            description: "Contact's email"
            type: string
            example: friendemail@gmail.com
          isFavourite:
            description: "Whether this contact is favourite or not"
            type: boolean
            example: true
          contactType:
            description: 'Type/group of contact'
            type: string
            enum: ['work', 'personal', 'home']
          photo:
            description: "Link to contact's profile photo"
            type: string
            format: binary
responses:
  '200':
    description: 'Patch contact with specified id'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully updated contact with id 65ca67e7ae7f10c88b598384!
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'

